version: 1
backend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
    build:
      commands:
        - export NPM_CONFIG_LEGACY_PEER_DEPS=true
        - npm install --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - export NPM_CONFIG_LEGACY_PEER_DEPS=true
        - npm install --cache .npm --prefer-offline --ignore-scripts
    build:
      commands:
        # Viteのビルドでメモリ不足によるハングを防ぐための安全策
        - export NODE_OPTIONS="--max-old-space-size=4096"
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
